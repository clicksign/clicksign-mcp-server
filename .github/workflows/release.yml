name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Check the tag matches plugin.json
        run: |
          version="$(node -p "require('./plugin.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin.json version ${version}"
            exit 1
          fi
      - run: npm test
      - run: npm run package -- --release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/clicksign-${GITHUB_REF_NAME#v}.zip"
          sha256sum "$zip" > "$zip.sha256"
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
